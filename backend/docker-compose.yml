version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: dreamkey_postgres
    restart: always
    environment:
      POSTGRES_USER: dreamkey_user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: dreamkey
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: